# Configuratie voor het Predictive Maintenance model.
# Paden zijn relatief ten opzichte van de projectmap.

data:
  pad: data/ai4i2020.csv
  id_kolom: UDI

doel: Machine failure

features:
  numeriek:
    - Air temperature [K]
    - Process temperature [K]
    - Rotational speed [rpm]
    - Torque [Nm]
    - Tool wear [min]
  categorisch:
    - Type
  # UDI, Product ID, TWF, HDF, PWF, OSF, RNF staan hier bewust NIET:
  #   - UDI/Product ID zijn identifiers, geen voorspellers
  #   - TWF/HDF/PWF/OSF/RNF zijn sub-labels van het doel → data leakage

split:
  test_grootte: 0.2
  seed: 42

model:
  pad: models/model.joblib
  max_iter: 1000
  # Recall is onze primaire metriek. Een model dat slechter doet dan dit
  # op recall mag niet naar productie.
  minimum_recall: 0.60

threshold: 0.15
